# Defines cron jobs on luci-scheduler-dev.appspot.com.
#
# See http://luci-config.appspot.com/schemas/projects:scheduler.cfg for
# schema of this file and documentation.

acl_sets {
  name: "default"
  acls {
    role: READER
    granted_to: "group:all"
  }
  acls {
    role: OWNER
    # https://chrome-infra-auth-dev.appspot.com/auth/groups/project-infra-troopers
    granted_to: "group:project-infra-troopers"
  }
}

acl_sets {
  name: "restricted"
  acls {
    role: READER
    # https://chrome-infra-auth-dev.appspot.com/auth/groups/luci-scheduler-dev-test-group2
    granted_to: "group:luci-scheduler-dev-test-group2"
  }
  acls {
    role: OWNER
    # https://chrome-infra-auth-dev.appspot.com/auth/groups/luci-scheduler-dev-test-group
    granted_to: "group:luci-scheduler-dev-test-group"
  }
}


# Fetch URL each minute.
job {
  id: "url-fetch-test-1"
  acl_sets: "default"
  schedule: "0 * * * * * *"

  url_fetch: {
    url: "http://fake-response.appspot.com/api/?sleep=30&data={}"
    timeout_sec: 40
  }
}

# Launch swarming task that sleeps in a loop.
job {
  id: "swarming-sleepy-job"
  acl_sets: "default"
  schedule: "with 10s interval"

  swarming: {
    server: "https://chromium-swarm-dev.appspot.com"

    command: "/bin/sleep"
    command: "60"

    dimensions: "os:Ubuntu"
    dimensions: "pool:Testing"
    priority: 20
  }
}

# Launch Buildbucket task every 10 min.
job {
  id: "buildbucket-job-1"
  acl_sets: "default"
  schedule: "0 0,10,20,30,40,50 * * * * *"

  buildbucket: {
    server: "https://cr-buildbucket-dev.appspot.com"
    bucket: "luci-cron-test"
    builder: "foo"
  }
}

# Phony trigger.
trigger {
  id: "noop-trigger"
  acl_sets: "default"
  schedule: "continuously"
  noop: {}
}


# Phony triggerable noop.
trigger {
  id: "noop-kick-me"
  acl_sets: "default"
  schedule: "triggered"
  noop: {}
}


# Low traffic gitiles trigger.
trigger {
  id: "luci-go-trigger"
  acl_sets: "default"

  gitiles: {
    repo: "https://chromium.googlesource.com/infra/luci/luci-go.git"
    refs: "refs/heads/master"
  }
  triggers: "noop-kick-me"
}


# High traffic gitiles trigger.
trigger {
  id: "chromium-src-trigger"
  acl_sets: "default"

  gitiles: {
    repo: "https://chromium.googlesource.com/chromium/src"
    refs: "refs/heads/master"
  }
  triggers: "noop-kick-me"
}

# Another buildbucket job but with ACLs.
job {
  id: "buildbucket-job-2-googlers-only"
  schedule: "0 5,15,25,35,45,55 * * * * *"

  buildbucket: {
    server: "https://cr-buildbucket-dev.appspot.com"
    bucket: "luci-cron-test"
    builder: "foo"
  }
  acl_sets: "restricted"
}
