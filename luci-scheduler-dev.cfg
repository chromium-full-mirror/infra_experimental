# Defines cron jobs on luci-scheduler-dev.appspot.com.
#
# See http://luci-config.appspot.com/schemas/projects:scheduler.cfg for
# schema of this file and documentation.

acl_sets {
  name: "default"
  acls {
    role: READER
    granted_to: "group:all"
  }
  acls {
    role: OWNER
    # https://chrome-infra-auth-dev.appspot.com/auth/groups/project-infra-troopers
    granted_to: "group:project-infra-troopers"
  }
}

job {
  id: "interval-1h"
  realm: "test-realm"
  acl_sets: "default"
  schedule: "with 1h interval"
  noop: {}
}

job {
  id: "every-5m"
  realm: "test-realm"
  acl_sets: "default"
  schedule: "*/5 * * * *"
  noop: {}
}

# These jobs run 'comprehensive ui tests' on a loop for use during the
# implementation of native 'build.proto'.
#
# crbug.com/909848
job {
  id: "build.proto.default"
  realm: "build.proto.experiment"
  acl_sets: "default"
  schedule: "with 1h interval"
  buildbucket: {
    server: "cr-buildbucket-dev.appspot.com"
    bucket: "build.proto.experiment"
    builder: "default"
  }
}
job {
  id: "build.proto.new-mode"
  realm: "build.proto.experiment"
  acl_sets: "default"
  schedule: "with 1h interval"
  buildbucket: {
    server: "cr-buildbucket-dev.appspot.com"
    bucket: "build.proto.experiment"
    builder: "new mode"
  }
}
job {
  id: "build.proto.new-mode.windows"
  realm: "build.proto.experiment"
  acl_sets: "default"
  schedule: "with 1h interval"
  buildbucket: {
    server: "cr-buildbucket-dev.appspot.com"
    bucket: "build.proto.experiment"
    builder: "new mode (windows)"
  }
}
