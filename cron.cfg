# Defines cron jobs on luci-cron.appspot.com.
#
# See http://luci-config.appspot.com/schemas/projects:cron.cfg for
# schema of this file and documentation.

# Do nothing each 10 sec.
job {
  id: "noop-test-1"
  schedule: "*/10 * * * * * *"
  task: {
    noop: {}
  }
}

# Fetch URL each minute.
job {
  id: "url-fetch-test-1"
  schedule: "0 * * * * * *"
  task: {
    url_fetch: {
      url: "http://fake-response.appspot.com/?sleep=30"
      timeout_sec: 40
    }
  }
}

# Launch swarming task once a month (~= never, launched manually when testing).
job {
  id: "swarming-job-1"
  schedule: "* * * 1 * * *"
  task: {
    swarming_task: {
      server: "https://chromium-swarm-dev.appspot.com"

      command: "echo"
      command: "Hello, world"

      dimensions: "os:Linux"
      priority: 20
    }
  }
}
