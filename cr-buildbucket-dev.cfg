# Defines buckets on cr-buildbucket-dev.appspot.com, used by to schedule builds
# on buildbot.
#
# See http://luci-config.appspot.com/schemas/projects:buildbucket.cfg for
# schema of this file and documentation.
#
# Please keep this list sorted by bucket name.

acl_sets {
  name: "internal"
  acls {
    role: SCHEDULER
    group: "service-account-cq"
  }
  acls {
    role: WRITER
    group: "service-account-infra-internal-master"
  }
  acls {
    role: WRITER
    group: "service-chromereviews-googleplex-com"
  }
  acls {
    role: SCHEDULER
    group: "buildbucket-internal-builds-access"
  }
}

acl_sets {
  name: "public"
  acls {
    role: READER
    group: "all"
  }
}

acl_sets {
  name: "scheduler"
  acls {
    role: WRITER
    identity: "luci-cron@appspot.gserviceaccount.com"
  }
  acls {
    role: WRITER
    identity: "luci-cron-dev@appspot.gserviceaccount.com"
  }
  acls {
    role: WRITER
    identity: "luci-scheduler-dev@appspot.gserviceaccount.com"
  }
}

buckets {
  name: "build.proto.experiment"

  acls {
    role: WRITER
    identity: "iannucci@google.com"
  }
  acls {
    role: WRITER
    identity: "luci-scheduler-dev@appspot.gserviceaccount.com"
  }

  swarming {
    hostname: "chromium-swarm-dev.appspot.com"
    builder_defaults {
      dimensions: "pool:Chrome"
      recipe {
        name: "engine_tests/comprehensive_ui"

        cipd_package: "infra/recipe_bundles/chromium.googlesource.com/infra/luci/recipes-py"
        cipd_version: "refs/heads/master"
      }
    }
    builders {
      name: "default"
      dimensions: "os:Ubuntu"
    }
    builders {
      name: "new mode"
      dimensions: "os:Ubuntu"
    }
    builders {
      name: "new mode (windows)"
      dimensions: "os:Windows"
    }
  }
}

buckets {
  name: "luci-cron-test"
  acl_sets: "public"
  acl_sets: "scheduler"

  acls {
    role: WRITER
    group: "administrators"
  }
  swarming {
    hostname: "chromium-swarm-dev.appspot.com"
    builders {
      name: "foo"

      dimensions: "pool:Testing"
      dimensions: "os:Ubuntu"

      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "bar"
      }
    }
  }
}

buckets {
  name: "master.chromium.infra"
  acls {
    role: WRITER
    group: "service-account-infra-master"
  }
}

buckets {
  name: "master.chromium.infra.cron"
  acls {
    role: WRITER
    group: "service-account-infra-master-cron"
  }
}

buckets {
  name: "master.internal.infra"
  acl_sets: "internal"
}

buckets {
  name: "master.internal.infra.cron"
  acl_sets: "internal"
}

buckets {
  name: "master.internal.infra.try"
  acl_sets: "internal"
}

buckets {
  name: "nodir"
  acls {
    role: READER
    group: "all"
  }
  acls {
    role: WRITER
    identity: "nodir@google.com"
  }
  acls {
    role: WRITER
    identity: "nodir@chromium.org"
  }
  acls {
    role: WRITER
    identity: "vadimsh@google.com"
  }
  acls {
    role: WRITER
    identity: "estaab@google.com"
  }
  acls {
    role: WRITER
    identity: "dnj@google.com"
  }
  swarming {
    hostname: "chromium-swarm-dev.appspot.com"
    url_format: "https://luci-milo-dev.appspot.com/swarming/task/{task_id}?server=chromium-swarm-dev.appspot.com"
    builder_defaults {
      swarming_tags: "allow_milo:1"
      swarming_tags: "master:master.nodir"
      dimensions: "cpu:x86-64"
      dimensions: "pool:default"
      build_numbers: YES
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
      }
    }

    builders {
      category: "Infra"
      name: "Infra Presubmit"
      dimensions: "os:Linux"
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "run_presubmit"
        properties: "repo_name:infra"
        properties_j: "runhooks:true"
      }
    }

    builders {
      name: "LUCI linux_chromium_rel_ng"
      dimensions: "os:Linux"
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "chromium_trybot"
        properties: "mastername:luci.chromium.try"
      }
    }
  }
}

buckets {
  name: "nodir.secret"
  acls {
    role: READER
    identity: "chromereviews-hr-staging.google.com@appspot.gserviceaccount.com"
  }
  acls {
    role: WRITER
    identity: "nodir@google.com"
  }
  swarming {
    hostname: "chromium-swarm-dev.appspot.com"
    builder_defaults {
      dimensions: "pool:default"
    }
    builders {
      name: "foo"
      dimensions: "os:Ubuntu"
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "bar"
      }
    }
  }
}

buckets {
  name: "test"
  acls {
    role: WRITER
    group: "all"
  }
}

