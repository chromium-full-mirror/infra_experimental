# Defines buckets on cr-buildbucket.appspot.com, used by to schedule builds
# on buildbot.
#
# See http://luci-config.appspot.com/schemas/projects:buildbucket.cfg for
# schema of this file and documentation.
#
# Please keep this list sorted by bucket name.

buckets {
  name: "estaab-infra-waterfall-test"
  acls {
    role: READER
    group: "all"
  }
  acls {
    role: WRITER
    identity: "nodir@google.com"
  }
  acls {
    role: WRITER
    identity: "vadimsh@google.com"
  }
  acls {
    role: WRITER
    identity: "estaab@google.com"
  }
  acls {
    role: WRITER
    identity: "luci-cron@appspot.gserviceaccount.com"
  }
  swarming {
    hostname: "chromium-swarm-dev.appspot.com"
    common_swarming_tags: "master:master.estaab-infra-waterfall-test"
    common_dimensions {
      key: "cores"
      value: "8"
    }
    builders {
      name: "infra-continuous-precise-32"
      swarming_tags: "builder:infra-continuous-precise-32"
      dimensions {
        key: "os"
        value: "Ubuntu-12.04"
      }
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "infra/infra_continuous"
      }
    }
  }
}

buckets {
  name: "luci-cron-test"
  acls {
    role: READER
    group: "all"
  }
  acls {
    role: WRITER
    identity: "luci-cron@appspot.gserviceaccount.com"
  }
  acls {
    role: WRITER
    group: "administrators"
  }
  swarming {
    hostname: "chromium-swarm-dev.appspot.com"
    builders {
      name: "foo"
      dimensions {
        key: "os"
        value: "Ubuntu"
      }
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "bar"
      }
    }
  }
}

buckets {
  name: "master.chromium.infra"
  acls {
    role: WRITER
    group: "service-account-infra-master"
  }
}

buckets {
  name: "master.chromium.infra.cron"
  acls {
    role: WRITER
    group: "service-account-infra-master-cron"
  }
}

buckets {
  name: "master.internal.infra"
  acls {
    role: SCHEDULER
    group: "service-account-cq"
  }
  acls {
    role: WRITER
    group: "service-account-infra-internal-master"
  }
  acls {
    role: WRITER
    group: "service-chromereviews-googleplex-com"
  }
  acls {
    role: SCHEDULER
    group: "buildbucket-internal-builds-access"
  }
}

buckets {
  name: "master.internal.infra.cron"
  acls {
    role: SCHEDULER
    group: "service-account-cq"
  }
  acls {
    role: WRITER
    group: "service-account-infra-internal-master"
  }
  acls {
    role: WRITER
    group: "service-chromereviews-googleplex-com"
  }
  acls {
    role: SCHEDULER
    group: "buildbucket-internal-builds-access"
  }
}

buckets {
  name: "master.internal.infra.try"
  acls {
    role: SCHEDULER
    group: "service-account-cq"
  }
  acls {
    role: WRITER
    group: "service-account-infra-internal-master"
  }
  acls {
    role: WRITER
    group: "service-chromereviews-googleplex-com"
  }
  acls {
    role: SCHEDULER
    group: "buildbucket-internal-builds-access"
  }
}

buckets {
  name: "nodir"
  acls {
    role: READER
    group: "all"
  }
  acls {
    role: WRITER
    identity: "nodir@google.com"
  }
  acls {
    role: WRITER
    identity: "vadimsh@google.com"
  }
  acls {
    role: WRITER
    identity: "estaab@google.com"
  }
  swarming {
    hostname: "chromium-swarm-dev.appspot.com"
    common_swarming_tags: "master:master.nodir"
    common_dimensions {
      key: "cores"
      value: "8"
    }
    builders {
      name: "foo"
      swarming_tags: "builder:foo"
      dimensions {
        key: "os"
        value: "Linux"
      }
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "bar"
      }
    }
  }
}

