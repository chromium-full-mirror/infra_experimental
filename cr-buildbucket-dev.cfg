# Defines buckets on cr-buildbucket-dev.appspot.com, used by to schedule builds
# on buildbot.
#
# See http://luci-config.appspot.com/schemas/projects:buildbucket.cfg for
# schema of this file and documentation.
#
# Please keep this list sorted by bucket name.

buckets {
  name: "build.proto.experiment"

  acls {
    role: READER
    group: "all"
  }
  acls {
    role: WRITER
    identity: "iannucci@google.com"
  }

  swarming {
    hostname: "chromium-swarm-dev.appspot.com"
    builder_defaults {
      dimensions: "pool:luci.chromium.ci"
      properties: <<EOF
      {
        "recipe": "engine_tests/comprehensive_ui"
      }
      EOF
      exe {
        cipd_package: "infra/recipe_bundles/chromium.googlesource.com/infra/luci/recipes-py"
        cipd_version: "refs/heads/master"
      }
      experiments {
        key: "luci.use_realms"
        value: 100
      }
    }
    builders {
      name: "default"
      dimensions: "os:Ubuntu"
      exe {
        cmd: "recipes"   # opt-out of luciexe
      }
    }
    builders {
      name: "new mode"
      dimensions: "os:Ubuntu"
      exe {
        cmd: "luciexe"   # opt-in to luciexe
      }
    }
    builders {
      name: "new mode (windows)"
      dimensions: "os:Windows"
      # respect server default
    }
    builders {
      name: "new mode python3"
      dimensions: "os:Ubuntu"
      exe {
        cmd: "luciexe"
      }
      experiments {
        key: "luci.recipes.use_python3"
        value: 100
      }
    }
    builders {
      name: "new mode (windows) python3"
      dimensions: "os:Windows"
      exe {
        cmd: "luciexe"
      }
      experiments {
        key: "luci.recipes.use_python3"
        value: 100
      }
    }
  }
}

buckets {
  name: "weiweilin"
  acls {
    role: READER
    group: "all"
  }
  acls {
    role: WRITER
    identity: "weiweilin@google.com"
  }
  swarming {
    hostname: "chromium-swarm-dev.appspot.com"
    builder_defaults {
      dimensions: "pool:default"
    }
    builders {
      name: "foo"
      description_html: "a <strong>builder</strong> description"
      dimensions: "os:Ubuntu"
      recipe {
        cipd_package: "infra/recipe_bundles/chromium.googlesource.com/chromium/tools/build"
        cipd_version: "refs/heads/master"
        name: "bar"
      }
    }
    builders {
      name: "foo(foo)"
      description_html: "a <strong>builder</strong> description"
      dimensions: "os:Ubuntu"
      recipe {
        cipd_package: "infra/recipe_bundles/chromium.googlesource.com/chromium/tools/build"
        cipd_version: "refs/heads/master"
        name: "bar"
      }
    }
  }
}
