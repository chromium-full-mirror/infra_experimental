# Defines cron jobs on luci-cron.appspot.com.
#
# See http://luci-config.appspot.com/schemas/projects:cron.cfg for
# schema of this file and documentation.

# Fetch URL each minute.
job {
  id: "url-fetch-test-1"
  schedule: "0 * * * * * *"
  task: {
    url_fetch: {
      url: "http://fake-response.appspot.com/?sleep=30"
      timeout_sec: 40
    }
  }
}

# Launch swarming task every 10 min.
job {
  id: "swarming-job-1"
  schedule: "0 0,10,20,30,40,50 * * * * *"
  task: {
    swarming_task: {
      server: "https://chromium-swarm-dev.appspot.com"

      command: "echo"
      command: "Hello, world"

      dimensions: "os:Ubuntu"
      dimensions: "pool:default"
      priority: 20
    }
  }
}

# Launch swarming task that sleeps in a loop.
job {
  id: "swarming-job-2"
  schedule: "with 10s interval"
  task: {
    swarming_task: {
      server: "https://chromium-swarm-dev.appspot.com"

      command: "sleep"
      command: "60"

      dimensions: "os:Ubuntu"
      dimensions: "pool:default"
      priority: 20
    }
  }
}

# Launch Buildbucket task every 10 min.
job {
  id: "buildbucket-job-1"
  schedule: "0 0,10,20,30,40,50 * * * * *"
  task: {
    buildbucket_task: {
      server: "https://cr-buildbucket-dev.appspot.com"
      bucket: "luci-cron-test"
      builder: "foo"
    }
  }
}
