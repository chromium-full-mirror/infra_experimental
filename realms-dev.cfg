realms {
  name: "@root"
  bindings {
    role: "role/buildbucket.reader"
    principals: "group:all"
  }
  bindings {
    role: "role/configs.reader"
    principals: "group:all"
  }
  bindings {
    role: "role/logdog.reader"
    principals: "group:all"
  }
  bindings {
    role: "role/logdog.writer"
    principals: "group:luci-logdog-chromium-dev-writers"
  }
  bindings {
    role: "role/scheduler.owner"
    principals: "group:project-infra-troopers"
  }
  bindings {
    role: "role/scheduler.reader"
    principals: "group:all"
  }
  bindings {
    role: "role/swarming.taskTriggerer"
    principals: "group:project-infra-troopers"
  }
  enforce_in_service: "cr-buildbucket-dev"
  enforce_in_service: "luci-scheduler-dev"
}

realms {
  name: "build.proto.experiment"
  bindings {
    role: "role/buildbucket.triggerer"
    principals: "user:iannucci@google.com"
  }
}

realms {
  name: "weiweilin"
  bindings {
    role: "role/buildbucket.triggerer"
    principals: "user:weiweilin@google.com"
  }
}

realms {
  name: "test-realm"
  bindings {
    role: "role/milo.reader"
    principals: "user:weiweilin@google.com"
  }
}
