application: chrome-infra-mon-proxy
version: 1
runtime: python27
vm: true
module: vm
api_version: 1
threadsafe: true

manual_scaling:
  instances: 1

resources:
  cpu: .5
  memory_gb: 0.5
  disk_size_gb: 1

handlers:
- url: /.*
  script: vm_module.app

health_check:
  enable_health_check: True
  check_interval_sec: 30
