total_storage_limit: 500M
queue:
# Simulate accurate, evenly distributed QPS by starting one task per second.
# Intent: each task spawns |qps| number of requests.
- name: qps
  target: default
  rate: 1/s
  bucket_size: 10
  max_concurrent_requests: 500
  # Disable retries.
  retry_parameters:
    task_retry_limit: 0
    task_age_limit: 1s
