application: chrome-infra-loadtest
runtime: python27
api_version: 1
module: backend
threadsafe: true

handlers:
- url: /.*
  secure: always
  script: main.app_backend

libraries:
- name: endpoints
  version: 1.0
- name: jinja2
  version: latest
- name: pycrypto
  version: "2.6"
- name: webapp2
  version: "2.5.2"
- name: webob
  version: "1.2.3"

includes:
- components/auth
