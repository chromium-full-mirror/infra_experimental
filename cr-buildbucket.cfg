# Defines buckets on cr-buildbucket.appspot.com, used by to schedule builds
# on buildbot.
#
# See http://luci-config.appspot.com/schemas/projects:buildbucket.cfg for
# schema of this file and documentation.
#
# Please keep this list sorted by bucket name.

buckets {
  name: "test"
  acls {
    role: WRITER
    group: "all"
  }
}

buckets {
  name: "user.estaab"

  acls {
    role: READER
    group: "all"
  }
  acls {
    role: WRITER
    identity: "nodir@google.com"
  }
  acls {
    role: WRITER
    identity: "vadimsh@google.com"
  }
  acls {
    role: WRITER
    identity: "estaab@google.com"
  }
  acls {
    role: WRITER
    identity: "luci-cron@appspot.gserviceaccount.com"
  }
  acls {
    role: WRITER
    identity: "luci-cron-dev@appspot.gserviceaccount.com"
  }
  swarming {
    hostname: "chromium-swarm.appspot.com"
    url_format: "https://luci-milo.appspot.com/swarming/prod/{task_id}"
    builder_defaults {
      swarming_tags: "master:master.estaab"
      dimensions: "cores:8"
      dimensions: "pool:Chrome"
    }
    builders {
      name: "infra-continuous-precise-32"
      dimensions: "os:Ubuntu-12.04"
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "infra/infra_continuous"
      }
    }
  }
}

buckets {
  name: "user.phajdan"
  acls {
    role: READER
    group: "all"
  }
  acls {
    role: WRITER
    identity: "phajdan@google.com"
  }
  acls {
    role: SCHEDULER
    group: "project-chromium-tryjob-access"
  }

  swarming {
    hostname: "chromium-swarm.appspot.com"
    builder_defaults {
      swarming_tags: "allow_milo:1"
      dimensions: "pool:Chrome"
    }
    builders {
      name: "foobar"
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "path:example"
      }
    }

    builders {
      name: "build_presubmit"
      dimensions: "os:Ubuntu"
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "run_presubmit"
      }
    }

    builders {
      name: "linux_chromium"
      dimensions: "os:Ubuntu"
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "chromium"
      }
    }

    builders {
      name: "linux_chromium_trybot"
      dimensions: "os:Ubuntu"
      dimensions: "pool:Swarmbucket-Testing"
      recipe {
        repository: "https://chromium.googlesource.com/chromium/tools/build"
        name: "chromium_trybot"
      }
    }
  }
}
