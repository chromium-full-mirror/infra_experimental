application: google.com:slo-bro
version: 1
runtime: python27
api_version: 1
threadsafe: true
module: default
instance_class: F1
automatic_scaling:
  min_idle_instances: 1

handlers:
- url: /css
  static_dir: css
  secure: always

- url: /.*
  script: app.app
  secure: always

inbound_services:
- warmup

libraries:
- name: jinja2
  version: latest
