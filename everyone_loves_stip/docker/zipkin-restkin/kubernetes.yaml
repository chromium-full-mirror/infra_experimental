apiVersion: v1beta1
kind: Pod
id: zipkin
desiredState:
  manifest:
    version: v1beta1
    id: zipkin
    containers:
      - image: cyberstip/zipkin-testv1
        name: zipkin-cassandra
        volumeMounts:
          - mountPath: "/home/cassandra/data"
            name: zipkin-cassandra-disk
        ports:
          - containerPort: 8080
            hostPort: 8080
          - containerPort: 6956
            hostPort: 6956
        livenessProbe:
            # turn on application health checking
            enabled: true
            type: http
            # length of time to wait for a pod to initialize
            # after pod startup, before applying health checking
            initialDelaySeconds: 600
            # an http probe
            httpGet:
              path: /
              port: 8080
      - image: cyberstip/cq-restkin
        name: cq-restkin
    volumes:
      - name: zipkin-cassandra-disk
        source:
          persistentDisk:
            # This GCE PD must already exist and be formatted ext4
            pdName: zipkin-cassandra-disk
            fsType: ext4
