<link rel="import" href="/bower_components/polymer/polymer.html">

<link rel="import" href="/bower_components/app-route/app-route.html">

<link rel="import" href="/bower_components/iron-ajax/iron-ajax.html">
<link rel="import" href="/bower_components/iron-label/iron-label.html">

<link rel="import" href="/bower_components/paper-input/paper-input.html">

<link rel="import" href="/bower_components/vaadin-grid/vaadin-grid.html">

<link rel="import" href="/elements/common-mixin.html">

<script src="/bower_components/moment/min/moment.min.js"></script>


<dom-module id="cl-analysis">
  <template>
    <link rel="stylesheet" type="text/css" href="/static/main.css">

    <iron-ajax
      id="ajax"
      url="/prpc/cq_analyze.CQAnalyzeService/GetCLInfoForBuilder"
      method="POST"
      content-type="application/json"
      accept="json"
      json-prefix=")]}'"
      handle-as="json"
      loading="{{ajaxLoading}}"
      last-response="{{ajaxResponse}}"
      bubbles
      ></iron-ajax>
    <app-route
        route="{{route}}"
        pattern="/:builder/:issue/:patchset"
        data="{{routeData}}"
        tail="{{subroute}}"></app-route>
    <div id="app" class="content">
      <div>
        <div id="title-box">
          <h2>
            cl/<a href$="[[_builderLink(routeData.builder)]]">[[routeData.builder]]</a>/[[routeData.issue]]/[[routeData.patchset]]
          </h2>
          <h3>
            <div class="small-link">
              <a href$="[[_gerritLink(routeData.issue,routeData.patchset)]]" target="_blank">
                gerrit
              </a>
            </div>
            <div class="small-link">
              <a href$="[[_cqStatusLink(routeData.issue,routeData.patchset)]]" target="_blank">
                CQ status
              </a>
            </div>
          </h3>
        </div>
        <h3>
          <iron-label for="duration">
            Total duration:
          </iron-label>
          <span id="duration">[[_totalDuration(ajaxResponse.builds)]]</span>
        </h3>
      </div>
      <template is="dom-if" if="[[ajaxLoading]]">
        <div id="spinner-wrapper">
          <paper-spinner active></paper-spinner>
        </div>
      </template>
      <template is="dom-if" if="[[_not(ajaxLoading)]]">
        <vaadin-grid aria-label="Longest builds" items="[[ajaxResponse.builds]]">

          <vaadin-grid-column>
            <template class="header">
              <vaadin-grid-sorter path="buildNumber">Build Number</vaadin-grid-sorter>
            </template>
            <template>
              <span>
                <a href$=[[_buildAnalyzeLink(routeData.builder,item.buildNumber)]]>
                  [[item.buildNumber]]</a> <a class="small-link" href$=[[_bbBuildLink(master,routeData.builder,item.buildNumber)]] target="_blank"> MILO</a>
              </span>
            </template>
          </vaadin-grid-column>

          <vaadin-grid-column>
            <template class="header">
              <vaadin-grid-sorter path="duration">Duration</vaadin-grid-sorter>
            </template>
            <template>[[_duration(item.duration)]]</template>
          </vaadin-grid-column>

          <vaadin-grid-column>
            <template class="header">
              <vaadin-grid-sorter path="result">result</vaadin-grid-sorter>
            </template>
            <template>[[_textForBuildResult(item.result)]]</template>
          </vaadin-grid-column>

          <vaadin-grid-column>
            <template class="header">
              <vaadin-grid-sorter path="buildSched">Date scheduled</vaadin-grid-sorter>
            </template>
            <template>[[_ts(item.buildSched)]]</template>
          </vaadin-grid-column>

        </vaadin-grid>
      </template>
    </div>
  </template>
  <script>
    'use strict';
    class CLAnalysis extends Polymer.mixinBehaviors([CommonMixin], Polymer.Element) {
      static get is() { return 'cl-analysis'; }

      static get properties() {
        return {
          ajaxResponse: {
            type: Object,
          },
          route: {
            type: String,
            observer: '_routeChanged',
          },
          master: {
            type: String,
            computed: '_computeMaster(ajaxResponse.*)',
          },
          name: {
            type: String,
          },
          active: {
            type: Boolean,
          },
        }
      }

      static get observers() {
        return [
          '_query(route.*, routeData.*, active)',
        ];
      }

      _computeMaster(resp) {
        resp = resp.base;
        if (!resp || !resp.builds || resp.builds.length == 0) {
          return '';
        }
        return resp.builds[0].master.slice('master.'.length);
      }

      _query(route, routeData, active) {
        this._debounce(() => {
          route = route.base;
          routeData = routeData.base;
          if (active && route.prefix.endsWith('cl')) {
            let body = {
              builder: routeData.builder,
              issue: routeData.issue,
              patchset: routeData.patchset,
            };
            this.ajaxResponse = {};
            this.$.ajax.body = JSON.stringify(body);
            this.$.ajax.generateRequest();
          }
        });
      }

      _totalDuration(builds) {
        if (!builds) {
          return 0;
        }
        let time = builds.map((build) => build.duration).reduce((x, y) => x + y);
        return this._duration(time);
      }
    }
    customElements.define(CLAnalysis.is, CLAnalysis);
  </script>
</dom-module>
