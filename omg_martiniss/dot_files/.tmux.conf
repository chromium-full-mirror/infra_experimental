unbind-key -n C-a
set -g prefix ^A
set -g prefix2 ^A
bind a send-prefix

# Automatically renumber windows on close.
set-option -g renumber-windows on

# Long history
set-option -g history-limit 30000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# make reloading the config easy
bind r source-file ~/.tmux.conf
bind C-r source-file ~/.tmux.conf

# I'm lazy and don't let go of control
#bind C-n next-window
#bind C-p previous-window
#bind C-c new-window

# scrollback
bind -n F8 copy-mode

# Keep current path in new windows and panes
bind c new-window -c "#{pane_current_path}"

# Panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window

bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U


# Statusbar
set -g status on
set -g status-interval 5
set -g status-bg black
set -g status-left "#[fg=colour0,bg=colour220] #h #[fg=colour220,bg=colour0]"

set -g window-status-current-format '#[fg=red,bold]*#{window_index}#[fg=white,bold]|#[fg=yellow]#{pane_current_command}#[fg=white,bold]|#[fg=blue]#(/usr/local/google/home/martiniss/martiniss_scripts/title -currentPane #{pane_current_path})#[fg=red,bold]*'
set -g window-status-format '#[fg=white,bold]#{window_index}|#[fg=yellow]#{pane_current_command}#[fg=white]|#[fg=blue]#(/usr/local/google/home/martiniss/martiniss_scripts/title -currentPane #{pane_current_path})#[fg=white]'


set -s escape-time 0
